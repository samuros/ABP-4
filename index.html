<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- custom css -->
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <!-- google fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Victor+Mono:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
    <title>Gestor de tareas TaskFlow</title>
  </head>
  <body>
    <!-- modal agregar tareas-->
    <div
      class="modal fade"
      id="add-task-modal"
      tabindex="-1"
      aria-labelledby="add-task-title"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="add-task-title">Agregar una tarea</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>

          <div class="modal-body">
            <input
              type="text"
              id="input-text-new-task"
              class="form-control"
              placeholder="Nombre de la tarea (Ej: Pasear al perro)"
              aria-label="Campo agregar tarea"
              aria-describedby="basic-addon2"
              aria-hidden="inert"
              />
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              id="close-button-add"
              data-bs-dismiss="modal"
            >
              Cerrar
            </button>

            <button type="button" class="btn btn-outline-dark" id="button-save-new-task">Guardar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- modal editar tareas-->
   <div
      class="modal fade"
      id="edit-task-modal"
      tabindex="-1"
      aria-labelledby="edit-task-title"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="add-task-title">Editar una tarea</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>

          <div class="modal-body" id="modal-edit-body">

          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
              id="close-button-edit"
            >
              Cerrar
            </button>

            <button type="button" class="btn btn-outline-dark" id="button-save-edit-task">Guardar</button>
          </div>
        </div>
      </div>
    </div>

    <section class="main pt-3">
      <div class="container">
        <div class="row justify-content-center">
          <div class="sub col-12 col-md-9 col-lg-6">
            <section class="text titles">
              <h3>Gestor de tareas</h3>
              <p class="titles-sub">
                GESTOR DE TAREAS CON HTML, CSS Y JAVASCRIPT VANILLA
              </p>
            </section>
            <hr />
            <section class="text tasks">
              <p class="tasks-sub">LISTADO DE TAREAS</p>
              <div class="tasks-sub div mb-3 w-100 d-flex justify-content-end">
                <button
                  class="btn btn-outline-dark border-1 rounded"
                  id="button-add"
                  type="button"
                  data-bs-toggle="modal"
                  data-bs-target="#add-task-modal"
                >
                  Agregar una tarea
                </button>
              </div>
              <table class="table table-bordered" id="tasks-table">
                <thead>
                  <tr>
                    <th scope="col" class="table-id text-center">#</th>
                    <th scope="col">Tarea</th>
                    <th scope="col" class="table-actions text-center">
                      Fecha límite
                    </th>
                    <th scope="col" class="table-actions text-center">
                      Acciones
                    </th>
                  </tr>
                </thead>
                <tbody class="text-center align-middle">
                </tbody>
              </table>
            </section>
          </div>
        </div>
      </div>
    </section>
    <!-- bundlejs bootstrap-->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="./assets/js/script.js"></script>
  </body>
</html>
